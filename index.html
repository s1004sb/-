<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>과일 스카이 레이서</title>
<style>
  :root { --pink:#ff3f9e; --cyan:#5ff3ff; --yellow:#ffe14d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#140f33; font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; color:#fff; user-select:none; }
  canvas { display:block; }
  #hud { position:fixed; top:12px; left:16px; right:16px; pointer-events:none; display:none; }
  .row { display:flex; justify-content:space-between; font-size:18px; text-shadow:0 2px 6px #000; }
  .row b { color:var(--yellow); font-size:22px; }
  .bar { margin-top:8px; width:min(260px,60vw); height:12px; background:#0008; border:2px solid #fff6; border-radius:8px; overflow:hidden; }
  .bar div { height:100%; transition:width .1s; }
  #hp { background:linear-gradient(90deg,#ff3f6e,#ffb04d); }
  #boost { background:linear-gradient(90deg,#5ff3ff,#7c6bff); }
  .lbl { font-size:12px; margin-top:6px; opacity:.85; }
  #weapons { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:none; gap:10px; }
  .wp { pointer-events:auto; cursor:pointer; background:#0009; border:2px solid #fff4; border-radius:12px; padding:6px 12px; font-size:15px; text-align:center; min-width:84px; }
  .wp.on { border-color:var(--yellow); box-shadow:0 0 12px var(--yellow); }
  .wp span { font-size:26px; display:block; }
  #fever { color:var(--pink); font-weight:bold; margin-top:6px; text-shadow:0 0 8px var(--pink); }
  #banner { position:fixed; top:30%; width:100%; text-align:center; font-size:48px; font-weight:900; color:var(--yellow); text-shadow:0 0 18px var(--pink); opacity:0; transition:opacity .4s; pointer-events:none; }
  #flash { position:fixed; inset:0; background:#ff2040; opacity:0; pointer-events:none; transition:opacity .25s; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(#2b1d6acc,#0a0820ee); text-align:center; padding:16px; }
  #overlay h1 { font-size:clamp(34px,8vw,68px); margin:0; background:linear-gradient(#ffe14d,#ff3f9e); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 12px #ff3f9e88); }
  #overlay p { margin:8px 0 18px; opacity:.9; }
  .keys { background:#0006; border-radius:12px; padding:12px 18px; line-height:1.8; font-size:15px; text-align:left; }
  kbd { background:#fff2; border:1px solid #fff5; border-radius:4px; padding:0 6px; font-family:inherit; }
  button { margin-top:20px; font-size:22px; font-weight:bold; padding:12px 40px; border:none; border-radius:40px; color:#fff; cursor:pointer; background:linear-gradient(90deg,#ff3f9e,#ff9a3f); box-shadow:0 0 20px #ff3f9e99; font-family:inherit; }
  button:hover { transform:scale(1.05); }
  #result { font-size:22px; color:var(--yellow); }
</style>
</head>
<body>
<div id="hud">
  <div class="row"><div>점수 <b id="score">0</b></div><div>스테이지 <b id="stage">1</b></div></div>
  <div class="lbl">체력</div><div class="bar"><div id="hp"></div></div>
  <div class="lbl">부스터 (Shift)</div><div class="bar"><div id="boost"></div></div>
  <div id="fever"></div>
</div>
<div id="weapons">
  <div class="wp" data-w="0"><span>🍓</span>1 딸기</div>
  <div class="wp" data-w="1"><span>🍌</span>2 바나나</div>
  <div class="wp" data-w="2"><span>🍉</span>3 수박</div>
</div>
<div id="banner"></div>
<div id="flash"></div>
<div id="overlay">
  <h1>🍓 과일 스카이 레이서 🍌</h1>
  <p id="sub">뉴욕과 서울 하늘을 나는 자동차로 과일을 발사해 드론을 물리쳐라!</p>
  <div id="result"></div>
  <div class="keys">
    <kbd>WASD</kbd> / <kbd>방향키</kbd> 이동 &nbsp; <kbd>Space</kbd> / 마우스 클릭 발사<br>
    <kbd>1</kbd> 🍓 딸기 – 빠른 연사<br>
    <kbd>2</kbd> 🍌 바나나 – 3갈래 회전 관통탄<br>
    <kbd>3</kbd> 🍉 수박 – 느리지만 광역 폭발<br>
    <kbd>Q</kbd>/<kbd>E</kbd> 무기 변경 &nbsp; <kbd>Shift</kbd> 부스터 &nbsp; <kbd>P</kbd> 일시정지<br>
    📱 터치: 드래그로 이동, 자동 발사
  </div>
  <button id="start">게임 시작</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);

// ---------- 기본 설정 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const SKY = 0x1d1448;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 120, 540);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 1200);
scene.add(new THREE.HemisphereLight(0xa0a8ff, 0x331144, 1.0));
const sunLight = new THREE.DirectionalLight(0xffd0b0, 0.9);
sunLight.position.set(30, 80, 40);
scene.add(sunLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  return new THREE.CanvasTexture(c);
}

// 바닥 그리드
const gridTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#120a2c'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#ff3fd0'; g.lineWidth = 3; g.strokeRect(0, 0, w, h);
});
gridTex.wrapS = gridTex.wrapT = THREE.RepeatWrapping;
gridTex.repeat.set(40, 40);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), new THREE.MeshBasicMaterial({ map: gridTex }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// 신스웨이브 태양
const sunTex = canvasTex(256, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#ffe14d'); gr.addColorStop(1, '#ff3f9e');
  g.fillStyle = gr; g.beginPath(); g.arc(w / 2, h / 2, w / 2, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 8; i++) g.fillRect(0, h * 0.55 + i * 15, w, 3 + i * 1.2);
});
const sunMesh = new THREE.Mesh(new THREE.PlaneGeometry(260, 260),
  new THREE.MeshBasicMaterial({ map: sunTex, transparent: true, fog: false, depthWrite: false }));
scene.add(sunMesh);

// ---------- 도시: 뉴욕 / 서울 ----------
const pick = arr => arr[(Math.random() * arr.length) | 0];
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const planeGeo = new THREE.PlaneGeometry(1, 1);
const pillarMat = new THREE.MeshLambertMaterial({ color: 0xff5050, emissive: 0x551010 });
const geoCache = {};
const G = (key, make) => geoCache[key] || (geoCache[key] = make());

function facadeTex(bg, cols, { cw = 10, ch = 12, ww = 6, wh = 8, band } = {}) {
  const t = canvasTex(64, 128, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    for (let y = 3; y < h; y += ch) {
      if (band) { g.fillStyle = band; g.fillRect(0, y + wh, w, ch - wh); }
      for (let x = 3; x < w; x += cw) { g.fillStyle = pick(cols); g.fillRect(x, y, ww, wh); }
    }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const DK = '#15121f';
const FACADE = {
  brick:  { tex: facadeTex('#4a2a22', ['#ffcf6b', '#ffe9a8', DK, DK, DK], { cw: 8, ch: 14, ww: 4, wh: 9 }), glow: 0.65 },
  stone:  { tex: facadeTex('#55556a', ['#ffe9a8', '#ffd36b', DK, DK]), glow: 0.6 },
  glass:  { tex: facadeTex('#0c2238', ['#6bd8ff', '#3a8ac0', '#123a5a', '#123a5a'], { cw: 8, ch: 6, ww: 7, wh: 4 }), glow: 0.75 },
  glassW: { tex: facadeTex('#8a98a8', ['#e8f4ff', '#c8dcf0', '#5a6a80'], { cw: 8, ch: 6, ww: 7, wh: 4 }), glow: 0.45 },
  apt:    { tex: facadeTex('#c9c9d2', ['#ffe3a0', '#ffd080', '#2a3040', '#2a3040'], { cw: 10, ch: 12, ww: 7, wh: 6, band: '#a0a0ae' }), glow: 0.35 },
  neon:   { tex: facadeTex('#1a1030', ['#ff6bd8', '#6bf3ff', '#ffe14d', DK, DK]), glow: 0.8 },
  gold:   { tex: facadeTex('#6a4a08', ['#ffd76b', '#e0a830', '#3a2808'], { cw: 6, ch: 6, ww: 5, wh: 4 }), glow: 0.55 },
};
const roofMat = new THREE.MeshLambertMaterial({ color: 0x2a2638, emissive: 0x0a0812 });
const matCache = {};
// 높이에 맞춰 창문 반복 수를 맞춘 재질 (박스 윗면/아랫면은 지붕 재질)
function facade(kind, h) {
  const rep = Math.max(1, Math.round(h / 16));
  const key = kind + rep;
  if (!matCache[key]) {
    const t = FACADE[kind].tex.clone();
    t.needsUpdate = true;
    t.repeat.set(2, rep);
    const m = new THREE.MeshLambertMaterial({ color: 0xffffff, map: t, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: FACADE[kind].glow });
    matCache[key] = [m, m, roofMat, roofMat, m, m];
  }
  return matCache[key];
}
const M = {
  metal: new THREE.MeshPhongMaterial({ color: 0xc8ccd8, emissive: 0x333344, shininess: 100 }),
  white: new THREE.MeshPhongMaterial({ color: 0xf0f0f0, emissive: 0x555555 }),
  red: new THREE.MeshBasicMaterial({ color: 0xff2020 }),
  copper: new THREE.MeshPhongMaterial({ color: 0x6fc7a8, emissive: 0x1a5a46, flatShading: true }),
  stoneBase: new THREE.MeshLambertMaterial({ color: 0x8a8278, emissive: 0x2a241e }),
  pedestal: new THREE.MeshLambertMaterial({ color: 0xc8b898, emissive: 0x3a3024 }),
  flame: new THREE.MeshBasicMaterial({ color: 0xffb030 }),
  gold: new THREE.MeshPhongMaterial({ color: 0xffd060, emissive: 0x664400, shininess: 100 }),
  wood: new THREE.MeshPhongMaterial({ color: 0xa02a2a, emissive: 0x3a0808 }),
  tile: new THREE.MeshLambertMaterial({ color: 0x3a3a48, emissive: 0x101018 }),
  teal: new THREE.MeshBasicMaterial({ color: 0x2fb8a0 }),
  hill: new THREE.MeshLambertMaterial({ color: 0x1f4a2a, emissive: 0x081a0c }),
  water: new THREE.MeshLambertMaterial({ color: 0x6a4a30, emissive: 0x1a1008 }),
  crown: new THREE.MeshBasicMaterial({ color: 0xff6bd8 }),
  warm: new THREE.MeshBasicMaterial({ color: 0xfff0c0 }),
  cyan: new THREE.MeshBasicMaterial({ color: 0x5ff3ff }),
  lattice: new THREE.MeshBasicMaterial({ color: 0xcfe8ff, wireframe: true }),
  dark: new THREE.MeshBasicMaterial({ color: 0x0a0810 }),
};

// 바닥(y)에서부터 쌓는 박스
function box(g, w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(boxGeo, mat);
  m.scale.set(w, h, d); m.position.set(x, y + h / 2, z);
  g.add(m); return m;
}
function part(g, geo, mat, x, y, z) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z); g.add(m); return m;
}

// 네온 간판 (bg가 null이면 배경 없이 글자만)
const signCache = {};
function signMat(text, fg, bg, vertical) {
  const key = [text, fg, bg, vertical].join('|');
  if (signCache[key]) return signCache[key];
  const chars = [...text], fs = 56;
  const font = `900 ${fs}px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = font;
  const tw = Math.ceil(vertical ? fs * 1.3 : meas.measureText(text).width + fs);
  const th = Math.ceil(vertical ? chars.length * fs * 1.1 + fs * 0.6 : fs * 1.7);
  const tex = canvasTex(tw, th, (g, w, h) => {
    if (bg) {
      g.fillStyle = bg; g.fillRect(0, 0, w, h);
      g.strokeStyle = fg; g.lineWidth = 6; g.strokeRect(4, 4, w - 8, h - 8);
    }
    g.font = font; g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = fg; g.shadowBlur = 14;
    if (vertical) chars.forEach((c, i) => g.fillText(c, w / 2, fs * 0.85 + i * fs * 1.1));
    else g.fillText(text, w / 2, h / 2 + 2);
  });
  tex.minFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, transparent: !bg });
  return (signCache[key] = { mat, aspect: tw / th });
}
function sign(g, text, fg, { h = 5, maxW = 99, x = 0, y = 0, z = 0, rotY = 0, vertical = false, bg = '#0a0618' } = {}) {
  const s = signMat(text, fg, bg, vertical);
  const hh = Math.min(h, maxW / s.aspect);
  const m = new THREE.Mesh(planeGeo, s.mat);
  m.scale.set(hh * s.aspect, hh, 1);
  m.position.set(x, y, z); m.rotation.y = rotY;
  g.add(m); return m;
}
// 도로 쪽 벽면에 붙는 간판 위치
const roadFace = (s, w) => ({ x: -s * (w / 2 + 0.3), rotY: -s * Math.PI / 2 });

const NY_SIGNS = [['NYC', '#ffe14d'], ['I ♥ NY', '#ff3f6e'], ['BROADWAY', '#5ff3ff'], ['TIMES SQ', '#ffe14d'],
  ['5TH AVE', '#ff6bd8'], ['WALL ST', '#6bff9a'], ['PIZZA', '#ff9a3f'], ['MANHATTAN', '#5ff3ff'],
  ['BROOKLYN', '#ff6bd8'], ['HOT DOG', '#ffe14d'], ['TAXI', '#ffd700'], ['BAGEL', '#ffb06b']];
const SEOUL_SIGNS = [['치킨', '#ffe14d'], ['노래방', '#ff6bd8'], ['PC방', '#5ff3ff'], ['카페', '#ffb06b'],
  ['편의점', '#6bff9a'], ['떡볶이', '#ff3f6e'], ['분식', '#ffe14d'], ['찜질방', '#ff9a3f'], ['호프', '#ffd700'],
  ['약국', '#6bff9a'], ['김밥', '#5ff3ff'], ['삼겹살', '#ff6bd8'], ['국밥', '#ffb06b']];
const APT_NAMES = ['하늘마을', '한강뷰', '무지개', '푸른숲', '별빛마을', '햇살'];

// --- 뉴욕 ---
function waterTower(g, x, y, z) {
  for (const [lx, lz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) box(g, 0.3, 3, 0.3, M.metal, x + lx, y, z + lz);
  part(g, G('wt-tank', () => new THREE.CylinderGeometry(1.6, 1.6, 3.5, 10)), M.water, x, y + 4.75, z);
  part(g, G('wt-roof', () => new THREE.ConeGeometry(1.8, 1.5, 10)), M.water, x, y + 7.25, z);
}
function nyTower(s) {
  const g = new THREE.Group();
  const w = rand(10, 20), d = rand(10, 20), h = rand(30, 110);
  const kind = Math.random() < 0.5 ? 'brick' : 'stone';
  box(g, w, h, d, facade(kind, h), 0, 0, 0);
  let top = h;
  if (Math.random() < 0.45) {
    const h2 = h * rand(0.15, 0.35);
    box(g, w * 0.7, h2, d * 0.7, facade(kind, h2), 0, h, 0);
    top += h2;
  }
  if (Math.random() < 0.5) waterTower(g, rand(-0.2, 0.2) * w, top, rand(-0.2, 0.2) * d);
  else if (Math.random() < 0.4) part(g, G('ant', () => new THREE.CylinderGeometry(0.2, 0.4, 14, 6)), M.metal, 0, top + 7, 0);
  if (Math.random() < 0.4) {
    const [t, c] = pick(NY_SIGNS);
    sign(g, t, c, { h: rand(4, 7), maxW: d * 0.9, y: rand(10, Math.max(12, Math.min(h - 6, 40))), ...roadFace(s, w) });
  }
  return { g, half: w / 2 };
}
function timesSquare(s) {
  const g = new THREE.Group();
  const w = 18, d = 22, h = rand(55, 80);
  box(g, w, h, d, facade('neon', h), 0, 0, 0);
  let y = 6;
  for (let i = 0; i < 4; i++) {
    const [t, c] = pick(NY_SIGNS), sh = rand(6, 9);
    sign(g, t, c, { h: sh, maxW: d * 0.95, y: y + sh / 2, ...roadFace(s, w) });
    y += sh + 2;
  }
  sign(g, 'TIMES SQ', '#ffe14d', { h: 8, maxW: w * 1.5, y: h + 6, z: d / 2 });
  return { g, half: w / 2 };
}
function empire() {
  const g = new THREE.Group();
  box(g, 24, 36, 24, facade('stone', 36), 0, 0, 0);
  box(g, 17, 62, 17, facade('stone', 62), 0, 36, 0);
  box(g, 11, 18, 11, facade('stone', 18), 0, 98, 0);
  box(g, 7, 8, 7, M.crown, 0, 116, 0);
  part(g, G('emp-sp', () => new THREE.CylinderGeometry(0.4, 1.6, 22, 8)), M.metal, 0, 135, 0);
  part(g, G('beacon', () => new THREE.SphereGeometry(0.8, 8, 8)), M.red, 0, 146.5, 0);
  sign(g, 'EMPIRE STATE', '#ffe14d', { h: 3.5, maxW: 22, y: 6, z: 12.3 });
  return { g, half: 12 };
}
function chrysler() {
  const g = new THREE.Group();
  box(g, 16, 84, 16, facade('stone', 84), 0, 0, 0);
  for (let i = 0; i < 5; i++) {
    part(g, G('chr' + i, () => new THREE.CylinderGeometry(5.6 - i * 1.1, 6.6 - i * 1.1, 5, 8)), M.metal, 0, 86.5 + i * 5, 0);
    part(g, G('chrb' + i, () => new THREE.TorusGeometry(6.4 - i * 1.1, 0.25, 4, 8)), M.warm, 0, 84.3 + i * 5, 0).rotation.x = Math.PI / 2;
  }
  part(g, G('chr-sp', () => new THREE.ConeGeometry(1.2, 20, 8)), M.metal, 0, 119, 0);
  return { g, half: 8 };
}
function wtc() {
  const g = new THREE.Group();
  box(g, 24, 16, 24, facade('glass', 16), 0, 0, 0);
  part(g, G('wtc', () => new THREE.CylinderGeometry(6, 16, 150, 4, 1).rotateY(Math.PI / 4)), facade('glass', 150), 0, 91, 0);
  part(g, G('wtc-ant', () => new THREE.CylinderGeometry(0.3, 0.7, 40, 6)), M.white, 0, 186, 0);
  part(g, G('beacon', () => new THREE.SphereGeometry(0.8, 8, 8)), M.red, 0, 206, 0);
  return { g, half: 12 };
}
function liberty() {
  const g = new THREE.Group();
  box(g, 30, 5, 30, M.stoneBase, 0, 0, 0);
  box(g, 13, 22, 13, M.pedestal, 0, 5, 0);
  part(g, G('lib-body', () => new THREE.ConeGeometry(4.5, 24, 10)), M.copper, 0, 39, 0);
  part(g, G('lib-head', () => new THREE.SphereGeometry(2.2, 10, 8)), M.copper, 0, 52.5, 0);
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI * (0.1 + i * 0.8 / 6);
    const sp = part(g, G('lib-spike', () => new THREE.ConeGeometry(0.35, 2.4, 4)), M.copper, Math.cos(a) * 1.9, 54.5, -Math.sin(a) * 1.9);
    sp.rotation.z = -Math.cos(a) * 0.9; sp.rotation.x = -Math.sin(a) * 0.9;
  }
  part(g, G('lib-arm', () => new THREE.CylinderGeometry(0.7, 0.9, 13, 8)), M.copper, 2.8, 54, 0).rotation.z = -0.25;
  part(g, G('lib-torch', () => new THREE.CylinderGeometry(0.9, 0.5, 1.6, 8)), M.gold, 4.5, 61, 0);
  part(g, G('lib-flame', () => new THREE.ConeGeometry(0.8, 2.4, 8)), M.flame, 4.5, 63, 0);
  const tab = box(g, 2.6, 4, 1, M.copper, -3, 42, 1.5);
  tab.rotation.z = 0.3;
  sign(g, 'LIBERTY', '#ffe14d', { h: 2.5, maxW: 12, y: 18, z: 6.6 });
  return { g, half: 15 };
}

// --- 서울 ---
function apartment(s) {
  const g = new THREE.Group();
  const w = 10, d = rand(26, 32), h = rand(45, 85);
  box(g, w, h, d, facade('apt', h), 0, 0, 0);
  box(g, w * 0.6, 4, d * 0.3, roofMat, 0, h, 0);
  const num = (101 + ((Math.random() * 12) | 0)) + '동';
  sign(g, num, '#eef4ff', { h: 6, maxW: d * 0.5, y: h - 6, bg: null, ...roadFace(s, w) });
  sign(g, pick(APT_NAMES), '#ffffff', { h: 3, maxW: w * 0.95, y: h - 4, z: d / 2 + 0.3, bg: '#3050a0' });
  return { g, half: w / 2 };
}
function neonSeoul(s) {

let actx = null;
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  return actx;
}
function beep(freq, dur, type = 'square', vol = 0.05, slide) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
}
function boom(vol = 0.25) {
  const a = ac(); if (!a) return;
  const len = a.sampleRate * 0.5, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start();
}

const particles = [];
function burst(pos, color, n = 40, spd = 25, size = 0.9) {
  const geo = new THREE.BufferGeometry();
  const p = new Float32Array(n * 3), v = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    p[i * 3] = pos.x; p[i * 3 + 1] = pos.y; p[i * 3 + 2] = pos.z;
    const dir = new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize().multiplyScalar(rand(0.3, 1) * spd);
    v[i * 3] = dir.x; v[i * 3 + 1] = dir.y; v[i * 3 + 2] = dir.z;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const mat = new THREE.PointsMaterial({ color, size, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  particles.push({ pts, v, life: 1 });
}

function placeBuilding(builder, s, z, gap) {
  const { g, half } = builder(s);
  g.position.set(s * (half + gap), 0, z);
  scene.add(g);
  buildings.push({ mesh: g });
}

function spawnRow(z) {
  const zone = ZONES[zoneAt(z)];
  for (const s of [-1, 1]) {
    if (lastLandmark[s] - z > 260 && Math.random() < 0.2) {
      const builder = pick(zone.landmarks.filter(f => f !== lastPick));
      lastPick = builder;
      lastLandmark[s] = z;
      if (FAR.has(builder)) { placeBuilding(builder, s, z - 20, rand(55, 65)); skipBack[s] = 3; }
      else placeBuilding(builder, s, z, rand(31, 35));
      continue;
    }
    placeBuilding(zone.generic(), s, z - rand(0, 12), rand(31, 36));
    if (skipBack[s] > 0) skipBack[s]--;
    else if (Math.random() < 0.6) placeBuilding(zone.generic(), s, z - rand(0, 12), rand(60, 75));
  }
  // 스테이지 2부터 도로 위 장애물 기둥
  if (stage >= 2 && z < car.position.z - 200 && Math.random() < 0.12 + stage * 0.02) {
    const w = rand(6, 12), h = rand(10, 30), d = rand(6, 12);
    const m = new THREE.Mesh(boxGeo, pillarMat);
    m.scale.set(w, h, d);
    m.position.set(rand(-20, 20), h / 2, z);
    scene.add(m);
    buildings.push({ mesh: m, obstacle: true, w, h, d });
  }
}

function spawnEnemy() {
  const r = Math.random();
  let type = 'drone';
  if (stage >= 2 && r < 0.25) type = 'kami';
  else if (stage >= 3 && r < 0.4) type = 'heavy';
  else if (r < 0.1) type = 'heavy';
  const e = makeEnemy(type);
  e.baseX = rand(-20, 20);
  e.mesh.position.set(e.baseX, rand(6, 34), car.position.z - rand(360, 420));
  e.vz = type === 'heavy' ? rand(5, 12) : rand(12, 28);
  e.amp = rand(2, 10); e.freq = rand(0.6, 1.6); e.phase = rand(0, 6);
  e.fireCd = rand(0.5, 2);
  scene.add(e.mesh);
  enemies.push(e);
  // 편대 비행
  if (type === 'drone' && stage >= 2 && Math.random() < 0.3) {
    for (const off of [-6, 6]) {
      const f = makeEnemy('drone');
      Object.assign(f, { baseX: e.baseX + off, vz: e.vz, amp: e.amp, freq: e.freq, phase: e.phase, fireCd: rand(1, 3) });
      f.mesh.position.set(f.baseX, e.mesh.position.y, e.mesh.position.z - 6);
      scene.add(f.mesh);
      enemies.push(f);
    }
  }
}

    const m = makeFruit(weapon);
    m.position.copy(car.position).add(new THREE.Vector3(0, 0.3, -3));
    const vx = Math.sin(a) * w.speed * 0.5;
    scene.add(m);
    bullets.push({ mesh: m, vel: new THREE.Vector3(vx, 0, -(speed + w.speed)), life: 2, w, kind: weapon, prevZ: m.position.z, hit: new Set() });
  }
  if (weapon === 0) beep(900, 0.06, 'square', 0.025, 500);
  else if (weapon === 1) beep(500, 0.12, 'triangle', 0.06, 900);
  else beep(180, 0.25, 'sine', 0.12, 80);
}

function fireEnemy(e, spread = 0) {
  const m = new THREE.Mesh(enemyGeo.eye, new THREE.MeshBasicMaterial({ color: 0xff7a1a }));
  m.scale.setScalar(1.1);
  m.position.copy(e.mesh.position);
  const rel = new THREE.Vector3().subVectors(car.position, m.position);
  rel.x += spread;
  rel.normalize().multiplyScalar(65 + stage * 5);
  rel.z -= speed;
  scene.add(m);
  ebullets.push({ mesh: m, vel: rel, life: 6 });
}

function killEnemy(e) {
  scene.remove(e.mesh);
  e.dead = true;
  score += e.score;
  boom(0.2);
  burst(e.mesh.position, ENEMY[e.type].color, 50, 28);
  burst(e.mesh.position, 0xffffff, 20, 15, 0.6);
  if (Math.random() < 0.12) spawnPower(e.mesh.position);
}

function hitEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg; e.flash = 0.08;
  if (e.hp <= 0) killEnemy(e);
}

function splash(pos, w) {
  burst(pos, 0xff3355, 70, 35, 1.3);
  burst(pos, 0x111111, 25, 25, 0.7);
  burst(pos, 0x33cc44, 25, 30, 1.0);
  boom(0.3); shake = Math.max(shake, 0.25);
  for (const e of enemies) if (!e.dead && e.mesh.position.distanceTo(pos) < w.splash + e.r) hitEnemy(e, w.dmg);
}

// ---------- 업데이트 ----------
function update(dt) {
  time += dt;
  const ix = touch ? touch.dx : (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  const iy = touch ? touch.dy : (keys.ArrowUp || keys.KeyW ? 1 : 0) - (keys.ArrowDown || keys.KeyS ? 1 : 0);
  const boosting = (keys.ShiftLeft || keys.ShiftRight) && boost > 0;
  boost = clamp(boost + (boosting ? -45 : 14) * dt, 0, 100);
  speed = 60 + stage * 7 + (boosting ? 60 : 0);

  pvx += (ix * 30 - pvx) * Math.min(1, dt * 6);
  pvy += (iy * 22 - pvy) * Math.min(1, dt * 6);
  const p = car.position;
  p.x = clamp(p.x + pvx * dt, -25, 25);
  p.y = clamp(p.y + pvy * dt, 3, 40);
  p.z -= speed * dt;
  car.rotation.z = -pvx * 0.022;
  car.rotation.x = pvy * 0.018;
  car.position.y += Math.sin(time * 3) * 0.01;
  for (const f of car.flames) f.scale.set(1, rand(0.7, 1.3) * (boosting ? 2.2 : 1), 1);

  // 카메라
  shake = Math.max(0, shake - dt);
  const camT = new THREE.Vector3(p.x * 0.7, p.y + 5, p.z + 15);
  camera.position.lerp(camT, Math.min(1, dt * 5));
  camera.position.z = p.z + 15;
  camera.position.x += rand(-1, 1) * shake;
  camera.position.y += rand(-1, 1) * shake;
  camera.lookAt(p.x * 0.85, p.y + 1, p.z - 25);
  camera.fov += ((boosting ? 85 : 70) - camera.fov) * Math.min(1, dt * 4);
  camera.updateProjectionMatrix();

  reticle.position.set(p.x, p.y + 0.3, p.z - 55);
  reticle.lookAt(camera.position);
  ground.position.set(0, 0, Math.round(p.z / 40) * 40);
  sunMesh.position.set(0, 90, p.z - 900);

  // 도시 구간 전환 (뉴욕 ↔ 서울)
  const zi = zoneAt(p.z);
  if (zi !== curZone) { curZone = zi; showBanner(ZONES[zi].name); beep(520, 0.3, 'triangle', 0.08, 1040); }
  const k = Math.min(1, dt * 0.8);
  scene.background.lerp(ZONES[zi].sky, k);
  scene.fog.color.copy(scene.background);
  ground.material.color.lerp(ZONES[zi].grid, k);

  // 발사
  fireCd -= dt;
  const firing = keys.Space || mouseDown || !!touch;
  if (firing && fireCd <= 0) {
    fire();
    fireCd = WEAPONS[weapon].rate * (fever > 0 ? 0.5 : 1);
  }
  fever = Math.max(0, fever - dt);

  // 생성
  while (nextRowZ > p.z - 620) { spawnRow(nextRowZ); nextRowZ -= 32; }
  spawnCd -= dt;
  if (spawnCd <= 0) { spawnEnemy(); spawnCd = Math.max(0.35, 1.5 - stage * 0.13) * rand(0.7, 1.3); }
  powerCd -= dt;
  if (powerCd <= 0) { spawnPower(new THREE.Vector3(rand(-20, 20), rand(6, 32), p.z - 400)); powerCd = rand(10, 16); }

  // 과일 탄환
  for (const b of bullets) {
    b.prevZ = b.mesh.position.z;
    b.mesh.position.addScaledVector(b.vel, dt);
    b.life -= dt;
    if (b.kind === 0) b.mesh.rotation.z += dt * 12;
    else if (b.kind === 1) b.mesh.rotation.z += dt * 25;
    else { b.mesh.rotation.x -= dt * 8; b.vel.y -= 12 * dt; }
    const bp = b.mesh.position;
    for (const e of enemies) {
      if (e.dead || b.hit.has(e)) continue;
      const ep = e.mesh.position;
      if (Math.hypot(bp.x - ep.x, bp.y - ep.y) < e.r + 0.8 &&
          ep.z >= Math.min(b.prevZ, bp.z) - e.r && ep.z <= Math.max(b.prevZ, bp.z) + e.r) {
        b.hit.add(e);
        if (b.w.splash) { splash(bp.clone(), b.w); b.life = 0; break; }
        burst(bp, b.w.color, 12, 12, 0.6);
        hitEnemy(e, b.w.dmg);
        beep(300, 0.05, 'square', 0.03);
        if (!b.w.pierce) { b.life = 0; break; }
      }
    }
    if (b.life > 0 && b.kind === 2 && (bp.y < 1 || b.life < 0.05)) { splash(bp.clone(), b.w); b.life = 0; }
    if (b.life <= 0) b.dead = true;
  }

  // 적
  for (const e of enemies) {
    if (e.dead) continue;
    const ep = e.mesh.position;
    ep.z += e.vz * dt;
    const ahead = p.z - ep.z;
    if (e.type === 'kami') {
      if (ahead < 230) {
        ep.x += clamp(p.x - ep.x, -1, 1) * 18 * dt;
        ep.y += clamp(p.y - ep.y, -1, 1) * 14 * dt;
        e.vz = 50;
        e.mesh.lookAt(p);
      }
    } else {
      ep.x = e.baseX + Math.sin(time * e.freq + e.phase) * e.amp;
      e.mesh.rotation.y = Math.sin(time * 2 + e.phase) * 0.3;
      if (ahead > 35 && ahead < 260) {
        e.fireCd -= dt;
        if (e.fireCd <= 0) {
          if (e.type === 'heavy') { fireEnemy(e, -6); fireEnemy(e, 0); fireEnemy(e, 6); }
          else fireEnemy(e);
          e.fireCd = rand(1.4, 2.8) - Math.min(stage * 0.12, 0.8);
        }
      }
    }
    if (e.ring) e.ring.rotation.z += dt * 3;
    e.flash = Math.max(0, e.flash - dt);
    e.mat.emissiveIntensity = e.flash > 0 ? 2 : 0.3;
    if (ep.distanceTo(p) < e.r + 1.8) {
      damage(e.type === 'kami' ? 22 : 28);
      killEnemy(e);
      continue;
    }
    if (ep.z > p.z + 25) { scene.remove(e.mesh); e.dead = true; }
  }

  // 적 탄환
  for (const b of ebullets) {
    b.mesh.position.addScaledVector(b.vel, dt);
    b.life -= dt;
    if (b.mesh.position.distanceTo(p) < 1.9) { damage(10); burst(b.mesh.position, 0xff7a1a, 15, 10); b.life = 0; }
    if (b.life <= 0 || b.mesh.position.z > p.z + 20) b.dead = true;
  }

  // 아이템
  for (const u of powerups) {
    u.mesh.rotation.y += dt * 3;
    u.mesh.rotation.x += dt * 1.5;
    if (u.mesh.position.distanceTo(p) < 3.5) {
      if (u.type === 'heal') hp = Math.min(100, hp + 35);
      else fever = 10;
      showBanner(POWER[u.type].label);
      beep(600, 0.1, 'triangle', 0.08, 1200);
      setTimeout(() => beep(900, 0.15, 'triangle', 0.08, 1800), 90);
      burst(u.mesh.position, POWER[u.type].color, 30, 15);
      u.dead = true;
    } else if (u.mesh.position.z > p.z + 20) u.dead = true;
  }

  // 빌딩 / 장애물
  for (const b of buildings) {
    const m = b.mesh.position;
    if (b.obstacle && !b.hitDone && Math.abs(p.x - m.x) < b.w / 2 + 1.5 && p.y < b.h + 0.6 && Math.abs(p.z - m.z) < b.d / 2 + 2.6) {
      b.hitDone = true;
      damage(25);
      burst(p, 0xff5050, 30, 20);
    }
    if (m.z > p.z + 60) b.dead = true;
  }

  // 파티클
  for (const pt of particles) {
    pt.life -= dt * 1.2;
    const arr = pt.pts.geometry.attributes.position.array;
    for (let i = 0; i < arr.length; i++) { arr[i] += pt.v[i] * dt; pt.v[i] *= 0.97; }
    pt.pts.geometry.attributes.position.needsUpdate = true;
    pt.pts.material.opacity = Math.max(0, pt.life);
    if (pt.life <= 0) { scene.remove(pt.pts); pt.pts.geometry.dispose(); pt.pts.material.dispose(); pt.dead = true; }
  }

  // 정리
  for (const list of [bullets, enemies, ebullets, powerups, buildings, particles]) {
    for (let i = list.length - 1; i >= 0; i--) {
      if (list[i].dead) { if (list[i].mesh) scene.remove(list[i].mesh); list.splice(i, 1); }
    }
  }

  const ns = 1 + Math.floor(score / 1500);
  if (ns > stage) { stage = ns; showBanner('STAGE ' + stage); beep(400, 0.4, 'triangle', 0.1, 1200); }
}

let lastHud = '';
function updateHud() {
  const key = `${score}|${stage}|${Math.round(hp)}|${Math.round(boost)}|${Math.ceil(fever)}`;
  if (key === lastHud) return;
  lastHud = key;
  $('score').textContent = score;
  $('stage').textContent = stage;
  $('hp').style.width = hp + '%';
  $('boost').style.width = boost + '%';
  $('fever').textContent = fever > 0 ? `🍓🍌🍉 과일 피버! ${Math.ceil(fever)}초` : '';
}

// 타이틀 화면용 카메라 회전
function titleCam(t) {
  car.position.set(0, 14, 0);
  car.rotation.set(0, t * 0.4, Math.sin(t) * 0.1);
  camera.position.set(Math.sin(t * 0.2) * 12, 18, 12);
  camera.lookAt(0, 14, 0);
  ground.position.z = 0;
  sunMesh.position.set(0, 90, -900);
}
for (let z = 60; z > -620; z -= 32) spawnRow(z);

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === 'title') titleCam(now / 1000);
  else if (state === 'play' && !paused) { update(dt); updateHud(); }
  else if (state === 'over') {
    for (const pt of particles) {
      pt.life -= dt;
      const arr = pt.pts.geometry.attributes.position.array;
      for (let i = 0; i < arr.length; i++) arr[i] += pt.v[i] * dt;
      pt.pts.geometry.attributes.position.needsUpdate = true;
      pt.pts.material.opacity = Math.max(0, pt.life);
    }
    car.visible = false;
  }
  if (state === 'play') car.visible = true;
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
</script>
